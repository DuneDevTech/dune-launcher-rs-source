# cargo-deny para el launcher (launcher/Cargo.toml). CI: licenses + bans + sources bloquean; advisories avisa.
[graph]
all-features = false

[advisories]
unmaintained = "none"
yanked = "warn"

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "0BSD", "CC0-1.0", "Unlicense", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0",
  "OpenSSL", "CDLA-Permissive-2.0", "LGPL-3.0-or-later", "LGPL-3.0-only", "OFL-1.1", "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
