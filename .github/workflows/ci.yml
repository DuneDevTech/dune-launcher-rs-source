name: CI
# Corre en el runner self-hosted de este repo (host Dune, limitado por gh-runner.slice). Sin secretos de produccion.
# Politica de convencion (plan gratuito, sin branch protection): PR + CI en verde + review antes de fusionar. Ver docs/TESTING.md.
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NO_COLOR: "1"

jobs:
  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: [self-hosted, linux, dune]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks (binario fijado por sha256)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tgz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Secretos en el arbol de trabajo
        run: '"$RUNNER_TEMP/gitleaks" dir . --no-banner --redact --verbose'
      - name: Secretos en los commits del PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: '"$RUNNER_TEMP/gitleaks" git . --no-banner --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"'

  rust:
    name: Launcher (cargo test, clippy, cargo-deny)
    runs-on: [self-hosted, linux, dune]
    timeout-minutes: 240
    env:
      CARGO_HOME: /home/gh-runner/.cargo
      CARGO_TARGET_DIR: /home/gh-runner/cache/target-launcher
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      HORIZON_TELEMETRY_URL: "off"
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo --version; rustc --version
      - name: Licencias y avisos (cargo-deny, binario fijado por sha256)
        env:
          CARGO_DENY_VERSION: "0.21.0"
          CARGO_DENY_SHA256: "a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903"
        run: |
          set -euo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          base="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cd.tgz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$base.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/cd.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cd.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$base/cargo-deny" --manifest-path Cargo.toml --config ../deny.toml check --hide-inclusion-graph licenses bans sources
      - name: Avisos de seguridad (cargo-deny advisories, no bloquea)
        continue-on-error: true
        env:
          CARGO_DENY_VERSION: "0.21.0"
        run: |
          base="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          "$RUNNER_TEMP/$base/cargo-deny" --manifest-path Cargo.toml --config ../deny.toml check --hide-inclusion-graph advisories
      - name: Tests (cargo test -j2)
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo test --locked --lib --bins -j2
      - name: Clippy (no bloquea todavia)
        continue-on-error: true
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo clippy --locked --all-targets -j2 -- -D warnings
